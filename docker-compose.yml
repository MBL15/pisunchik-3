# Вся платформа одной командой: docker compose up -d --build  →  http://localhost:8000
# Наружу опубликован только шлюз (8000). Внутренние сервисы доступны лишь по сети compose, Postgres — только с этого компьютера
# (127.0.0.1:5432, для локальной разработки); порты сервисов для отладки откройте в docker-compose.override.yml.
x-app: &app
  build: .
  restart: unless-stopped
  environment: &env
    FSP_DATABASE_URL: postgresql://fsp:fsp@postgres:5432/fsp
    FSP_SPORTSMAN_URL: http://sportsman:8001
    FSP_COMPETITION_URL: http://competition:8002
    FSP_MARKET_URL: http://market:8003
    FSP_GATEWAY_URL: http://gateway:8000
    FSP_PUBLIC_BASE_URL: ${FSP_PUBLIC_BASE_URL:-http://localhost:8000}
    FSP_SECRET_KEY: ${FSP_SECRET_KEY:-dev-only-fsp56-change-me}  # вне демо задайте свой: им подписываются сессии
    FSP_SERVICE_TOKEN: ${FSP_SERVICE_TOKEN:-dev-only-service-token}  # служебный токен шлюза для внутренних сервисов
    FSP_TELEGRAM_TOKEN: ${FSP_TELEGRAM_TOKEN:-}
    FSP_TELEGRAM_BOT: ${FSP_TELEGRAM_BOT:-}
    FSP_TELEGRAM_PROXY: ${FSP_TELEGRAM_PROXY:-}  # если api.telegram.org с сервера недоступен: socks5://host.docker.internal:1080
    FSP_DEMO_TODAY: ${FSP_DEMO_TODAY:-}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fsp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp"]
      interval: 3s
      retries: 20

  sportsman:
    <<: *app
    command: uvicorn sportsman_service.main:app --host 0.0.0.0 --port 8001

  competition:
    <<: *app
    command: uvicorn competition_service.main:app --host 0.0.0.0 --port 8002

  market:
    <<: *app
    command: uvicorn market_service.main:app --host 0.0.0.0 --port 8003

  gateway:
    <<: *app
    command: uvicorn gateway_service.main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"  # доступ к туннельному прокси на хосте (docs/knowledge-base/08-dev-runbook.md)
    ports:
      - "8000:8000"
    depends_on:
      - sportsman
      - competition
      - market

volumes:
  fsp_pg:
